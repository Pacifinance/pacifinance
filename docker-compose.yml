services:
  redis:
    container_name: redis
    image: redis:8.6.0-alpine
    restart: unless-stopped
    volumes:
      - ./redis.conf:/usr/local/etc/redis/redis.conf
      - /var/lib/redis:/data
    networks:
      - backend
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]

  mongo:
    container_name: mongo
    image: mongo:6.0.26-jammy
    restart: unless-stopped
    volumes:
      - /var/lib/mongodb:/data/db
    networks:
      - backend
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]

  app:
    container_name: app
    build:
      context: .
      dockerfile: Dockerfile
    image: ${APP_IMAGE:-pacifinance:local}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env
    depends_on:
      - redis
      - mongo
    networks:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  backend:
    driver: bridge
